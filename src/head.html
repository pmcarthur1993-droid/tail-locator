<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tail Locator</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
  /* Styled to match the CAE Workpack Review tool: light ground, navy header, numbered step cards, pass/fail verdict boxes. */
  :root{
    --navy:#152a44; --navy2:#1e3a5f;
    --bg:#f2f4f7; --card:#ffffff; --border:#d9dee6; --soft:#fafbfd;
    --ink:#1c2733; --muted:#5b6b7c;
    --green:#0e7a3d; --green-bg:#e2f4e8; --green-bd:#b5e0c4;
    --red:#b02a1e; --red-bg:#fbe9e7; --red-bd:#f0c4bf;
    --amber:#8a6100; --amber-bg:#fdf3d7; --amber-bd:#ecd9a0;
    --blue:#1f5fa8; --blue-bg:#e8f0fa; --blue-bd:#bcd2ee;
    --yellow:#fff2a8; --yellow-bd:#e6c84a;
    --mono:Consolas,Menlo,"Courier New",monospace;
    color-scheme: light;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  html,body{background:var(--bg)}
  body{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;color:var(--ink);min-height:100vh;font-size:15px;line-height:1.45}
  a{color:var(--blue)} a:hover{text-decoration:underline}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  button,input,select{font:inherit;color:inherit}
  .mono{font-family:var(--mono);font-size:.93em}

  header.top{background:linear-gradient(180deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;padding:16px 28px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 6px rgba(0,0,0,.25);flex-wrap:wrap}
  .logo{width:38px;height:38px;border-radius:6px;background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;letter-spacing:.6px;flex:none}
  header h1{font-size:19px;font-weight:600;letter-spacing:.2px}
  header .sub{font-size:12.5px;opacity:.75;margin-top:2px}
  header .right{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header .ver{font-size:12px;opacity:.6}
  .utc{font-family:var(--mono);font-size:13px;opacity:.85}
  .dots{display:flex;gap:6px;flex-wrap:wrap}
  .dot{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.3px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.18)}
  .dot::before{content:"";width:7px;height:7px;border-radius:50%;background:#9aa7b5}
  .dot.on::before{background:#4ad17c} .dot.off{opacity:.65}

  nav.tabs{background:#fff;border-bottom:1px solid var(--border);padding:0 28px;display:flex;gap:4px;overflow-x:auto}
  nav.tabs button{border:none;background:none;padding:13px 16px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
  nav.tabs button:hover{color:var(--ink)}
  nav.tabs button[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--navy)}

  main{max-width:1080px;margin:26px auto 60px;padding:0 20px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 1px 3px rgba(16,32,54,.06);margin-bottom:22px;overflow:hidden}
  .card-h{padding:14px 20px;border-bottom:1px solid var(--border);font-weight:600;font-size:15px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .card-h .r{margin-left:auto;font-weight:500;font-size:12.5px;color:var(--muted)}
  .card-b{padding:20px}
  .step-n{width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center;flex:none}
  .note{font-size:12.5px;color:var(--muted)}
  .req-note{font-size:12.5px;color:var(--muted)}

  /* view switching */
  .v{display:none} body.view-simple .v-simple{display:block} body.view-full .v-full{display:block} body.view-dev .v-dev{display:block} body.view-settings .v-settings{display:block}

  /* search */
  .search{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:stretch}
  @media (max-width:600px){.search{grid-template-columns:1fr}}
  .field{position:relative;min-width:0}
  .search input[type=text]{width:100%;padding:12px 110px 12px 14px;border:1px solid var(--yellow-bd);border-radius:7px;background:var(--yellow);font-family:var(--mono);font-size:18px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
  .search input::placeholder{font-family:inherit;text-transform:none;letter-spacing:0;font-size:14px;color:#9aa7b5}
  .search .auto{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);user-select:none}
  .search .auto input{accent-color:var(--navy)}
  .btn{background:none;border:1px solid var(--border);border-radius:7px;padding:10px 18px;font-size:13.5px;color:var(--ink);cursor:pointer;font-weight:600}
  .btn:hover{border-color:#9aa7b5}
  .btn.primary{background:var(--navy);color:#fff;border-color:var(--navy);padding:12px 30px;font-size:15px}
  .btn.primary:hover:not(:disabled){background:var(--navy2)}
  .btn:disabled{background:#9aa7b5;border-color:#9aa7b5;color:#fff;cursor:not-allowed}
  .btn.small{padding:7px 12px;font-size:13px}
  .hint{margin-top:10px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
  .recent{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .chip{border:1px solid var(--border);background:var(--soft);border-radius:5px;padding:2px 9px;font-family:var(--mono);font-size:12px;cursor:pointer;color:var(--ink)}
  .chip:hover{border-color:var(--blue);color:var(--blue)}

  /* progress */
  .progress{display:none;align-items:center;gap:12px;padding:12px 20px;font-size:14px;color:var(--ink);font-weight:600;background:var(--blue-bg);border-top:1px solid var(--border)}
  .progress.on{display:flex}
  .spinner{width:16px;height:16px;border:2px solid var(--blue-bd);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;flex:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spinner{animation:none}}

  /* badges */
  .badge{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:4px;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
  .badge.pass,.status.ground{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd)}
  .badge.fail,.status.bad{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd)}
  .badge.warn,.status.stale{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bd)}
  .badge.info,.status.air{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-bd)}
  .status.none{background:var(--soft);color:var(--muted);border:1px solid var(--border)}
  .status.diverted{background:var(--red-bg,#fde8e8);color:var(--red,#b42318);border:1px solid var(--red-bd,#f3b8b8);font-weight:700}
  .status{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:4px;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
  .flag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:4px;border:1px solid var(--border);background:var(--soft);color:var(--ink)}
  .flag.bad{background:var(--red-bg);border-color:var(--red-bd);color:var(--red)}
  .flag.warn{background:var(--amber-bg);border-color:var(--amber-bd);color:var(--amber)}
  .flag.good{background:var(--green-bg);border-color:var(--green-bd);color:var(--green)}
  .flag.air{background:var(--blue-bg);border-color:var(--blue-bd);color:var(--blue)}
  .flags{display:flex;gap:6px;flex-wrap:wrap}

  /* simple result */
  .verdict-box{display:flex;align-items:center;gap:16px;padding:16px 20px;border-radius:8px;margin-bottom:16px;flex-wrap:wrap}
  .verdict-box.pass{background:var(--green-bg);border:1px solid var(--green-bd)}
  .verdict-box.fail{background:var(--red-bg);border:1px solid var(--red-bd)}
  .badge-lg{font-size:15px;font-weight:700;padding:8px 18px;border-radius:6px;letter-spacing:.5px;flex:none;color:#fff}
  .verdict-box.pass .badge-lg{background:var(--green)} .verdict-box.fail .badge-lg{background:var(--red)}
  .verdict-box .reg{font-family:var(--mono);font-size:17px;font-weight:700}
  .verdict-box .meta{font-size:13px;color:var(--muted)}
  .verdict-box p{font-size:14px;line-height:1.5;flex-basis:100%}
  .line-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:stretch}
  @media (max-width:560px){.line-row{grid-template-columns:1fr}}
  .line{width:100%;min-width:0;padding:13px 16px;border-radius:7px;border:1px solid var(--yellow-bd);background:var(--yellow);color:var(--ink);font-family:var(--mono);font-size:clamp(15px,2vw,19px);font-weight:600}
  .line.none{color:var(--red);border-color:var(--red)}
  .btn.copy.done{background:var(--green);border-color:var(--green);color:#fff}
  .line-card{margin-bottom:18px}
  details.allchecks{margin-top:16px;border:1px solid var(--border);border-radius:8px;background:var(--soft)}
  details.allchecks summary{padding:12px 16px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;user-select:none;list-style:none;display:flex;align-items:center;gap:8px}
  details.allchecks summary::before{content:"▸";transition:.15s}
  details.allchecks[open] summary::before{transform:rotate(90deg)}
  details.allchecks .inner{padding:4px 16px 14px;background:#fff;border-top:1px solid var(--border);border-radius:0 0 8px 8px}
  .checks{list-style:none;margin-top:8px;display:grid;gap:4px;font-size:13.5px}
  .checks li{display:grid;grid-template-columns:22px 190px minmax(0,1fr);gap:8px;padding:6px 0;border-bottom:1px solid #eceff3}
  .checks li:last-child{border-bottom:none}
  .checks li b{font-family:var(--mono)} .checks li.ok b{color:var(--green)} .checks li.bad b{color:var(--red)}
  .checks li span.d{color:var(--muted)}
  @media (max-width:560px){.checks li{grid-template-columns:22px minmax(0,1fr)} .checks li span.d{grid-column:2}}
  .sumsec{border-radius:8px;padding:12px 18px;margin-top:14px;border:1px solid}
  .sumsec .h{font-size:12.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px}
  .sumsec.amber{background:var(--amber-bg);border-color:var(--amber-bd)} .sumsec.amber .h{color:var(--amber)} .sumsec.amber p{color:#5f4300;font-size:14px}
  pre.code{background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-family:var(--mono);font-size:12px;line-height:1.5;overflow-x:auto;color:var(--ink)}

  /* full detail cards (one per registration) */
  .result-card .head{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
  @media (max-width:820px){.result-card .head{grid-template-columns:1fr}}
  .verdict{padding:20px;border-right:1px solid var(--border);display:grid;gap:14px;align-content:start;min-width:0}
  @media (max-width:820px){.verdict{border-right:0;border-bottom:1px solid var(--border)}}
  .reg-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .reg-row .reg{font-family:var(--mono);font-size:18px;font-weight:700}
  .reg-row .reg small{color:var(--muted);font-weight:400;font-size:12.5px;margin-left:8px;font-family:"Segoe UI",Arial,sans-serif}
  .board{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:end}
  @media (max-width:560px){.board{grid-template-columns:1fr;gap:8px}}
  .iata{font-weight:700;font-size:clamp(56px,10vw,84px);line-height:.95;letter-spacing:.01em;color:var(--navy);font-variant-numeric:tabular-nums}
  .iata.dim{color:#9aa7b5}
  .apt{min-width:0;display:grid;gap:4px;padding-bottom:4px}
  .apt .name{font-weight:600;font-size:18px;line-height:1.2}
  .apt .meta{color:var(--muted);font-size:13px;display:flex;gap:10px;flex-wrap:wrap}
  .summary{font-size:14.5px}
  .conf{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
  .conf .bar{display:inline-flex;gap:3px} .conf .bar i{width:18px;height:6px;border-radius:2px;background:var(--border);display:block}
  .conf.high .bar i{background:var(--green)} .conf.med .bar i:nth-child(-n+2){background:var(--amber)} .conf.low .bar i:nth-child(1){background:var(--red)}
  .map-pane{min-width:0;position:relative;background:#e9edf2}
  .map{height:100%;min-height:300px} @media (max-width:820px){.map{min-height:240px}}
  .map-pane .nomap{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;padding:20px;text-align:center}
  .leaflet-container{font-family:inherit}
  .ac-icon{width:26px;height:26px;display:grid;place-items:center;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))} .ac-icon svg{width:26px;height:26px;fill:var(--navy)}
  .apt-icon{width:14px;height:14px;border-radius:50%;background:var(--green);border:2px solid #fff;box-shadow:0 0 0 2px var(--green)}
  .apt-icon.dest{background:var(--blue);box-shadow:0 0 0 2px var(--blue)} .apt-icon.near{background:#9aa7b5;box-shadow:0 0 0 2px #9aa7b5;width:10px;height:10px}
  .detail{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--border)}
  @media (max-width:980px){.detail{grid-template-columns:repeat(2,minmax(0,1fr))}} @media (max-width:640px){.detail{grid-template-columns:1fr}}
  .cell{padding:14px 18px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);min-width:0;display:grid;gap:8px;align-content:start}
  .cell:last-child,.cell.wide{border-right:0} .cell.wide{grid-column:1/-1}
  .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600}
  .kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 10px;font-size:13.5px}
  .kv dt{color:var(--muted)} .kv dd{min-width:0;overflow-wrap:anywhere}
  .route{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;font-family:var(--mono)}
  .route .arr{color:var(--muted);font-weight:400} .route .strike{text-decoration:line-through;color:var(--muted)} .route .act{color:var(--red)}
  .evidence{margin:0;padding-left:18px;font-size:13.5px;display:grid;gap:4px} .evidence.note{color:var(--muted)}
  .photo{width:100%;aspect-ratio:3/2;max-width:100%;object-fit:cover;border-radius:6px;border:1px solid var(--border);background:var(--soft);display:block}
  .links{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:13px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:8px 12px;border-bottom:2px solid var(--border);font-weight:600;white-space:nowrap}
  td{padding:9px 12px;border-bottom:1px solid #eceff3;vertical-align:top}
  tr:last-child td{border-bottom:none}
  td.mono,.legs td{font-family:var(--mono);font-size:12.5px;white-space:nowrap} .legs td.text{font-family:inherit;font-size:13.5px}
  .legs .div{color:var(--red);font-weight:600} .legs .live{color:var(--blue);font-weight:600}
  .scroll{overflow-x:auto}
  .error{border-left:4px solid var(--red);padding:16px 20px} .error h3{font-size:16px;margin-bottom:6px;color:var(--red)}

  /* settings */
  .settings-grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
  .group{display:grid;gap:10px;align-content:start;min-width:0;padding:16px;border:1px solid var(--border);border-radius:8px;background:var(--soft)}
  .group h3{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .group p{font-size:13px;color:var(--muted)}
  .group label{display:grid;gap:5px;font-size:13px;color:var(--muted)}
  .group input[type=text],.group input[type=password],.group select{width:100%;padding:8px 10px;border-radius:6px;border:1px solid var(--border);background:#fff;color:var(--ink);font-family:var(--mono);font-size:13px}
  .group .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .group .inline{display:inline-flex;align-items:center;gap:6px} .group .inline input{accent-color:var(--navy)}
  .test-out{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.4em}
  .test-out.ok{color:var(--green)} .test-out.bad{color:var(--red)}

  /* developer tab */
  .dev h3.sec{font-size:14px;font-weight:600;margin:22px 0 10px} .dev h3.sec:first-child{margin-top:0}
  .dev p{font-size:14px;line-height:1.6;margin-bottom:8px}
  .dev ol,.dev ul{margin:4px 0 10px 20px;font-size:14px;line-height:1.65}
  .dev td.mono{white-space:normal;overflow-wrap:anywhere;font-size:12px}
  .dev table{table-layout:fixed} .dev th:first-child,.dev td:first-child{width:14%} .dev td{overflow-wrap:anywhere}
  .flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:8px 0 14px}
  .flow div{border:1px solid var(--border);background:var(--soft);border-radius:8px;padding:10px 12px;font-size:13px}
  .flow div b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--navy);margin-bottom:4px}
  footer{text-align:center;color:#9aa7b5;font-size:12px;padding:20px;line-height:1.6}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
